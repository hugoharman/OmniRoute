name: Build Opus 5.5 image

# release/v3.8.51 + PR #14546 (Claude Opus 5.5), published to GHCR.
on:
  push:
    branches: [opus-5-5-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opus55-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hugoharman/omniroute

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # next build peaks well above the default 4 GB swap on hosted runners (#11976).
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /extra-swap
          sudo chmod 600 /extra-swap
          sudo mkswap /extra-swap
          sudo swapon /extra-swap
          free -h
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/${{ matrix.arch }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE }}:opus55-${{ matrix.arch }}
          push: true
          provenance: false
          cache-from: type=gha,scope=opus55-${{ matrix.arch }}
          cache-to: type=gha,scope=opus55-${{ matrix.arch }},mode=max,ignore-error=true

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        run: |
          short_sha="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "$IMAGE:opus55" \
            -t "$IMAGE:3.8.51-opus55-$short_sha" \
            "$IMAGE:opus55-amd64" "$IMAGE:opus55-arm64"
          docker buildx imagetools inspect "$IMAGE:opus55"
